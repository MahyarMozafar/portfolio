<!-- Same mark as assets/logo.svg, but sitting on the site's own dark panel.
     The bare logo is near-white on transparent: right on the site, invisible in
     a Google result, where a white mark on a white background came out as an
     empty circle. The panel is what makes it readable on any surface, so this
     file and logo.svg are deliberately not the same — do not merge them.
     The mark is scaled down from logo.svg to clear the rounded corners.

     The -v2 in the filename is deliberate. Google's favicon cache is keyed by
     the icon's URL, and it had already fetched and stored the old invisible
     mark from /assets/favicon.svg. A URL it has never seen has nothing to serve
     from cache, so it has to fetch this one fresh. Do not rename it back. -->
<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="مهیار مظفر">
  <rect width="48" height="48" rx="11" fill="#0B0E14"/>
  <g fill="none" stroke="#EDEEF2" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.3 34V18.4l6.2 9.4 6.2-9.4V34"/>
    <path d="M23.9 34V18.4l6.2 9.4 6.2-9.4V34"/>
  </g>
  <path d="M36.4 13.7c2.3 0 3.3 1.8 2.1 3.6-1.3 1.9-.8 4 1.2 4.4"
        fill="none" stroke="#2F6FED" stroke-width="2.6" stroke-linecap="round"/>
</svg>
